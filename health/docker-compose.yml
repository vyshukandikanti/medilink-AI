version: '3.8'

services:
  web:
    build: .
    container_name: medilink_ai_app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=medilink-prod-secret-key-change-me
      - PORT=5000
    volumes:
      - medilink_data:/app/data
    restart: unless-stopped

volumes:
  medilink_data:
