zerops:
  - setup: api
    build:
      base: python@3.12
      buildCommands:
        - pip install --target=./vendor -r health/requirements.txt
      deployFiles:
        - health
        - vendor
    run:
      base: python@3.12
      envVariables:
        PYTHONPATH: /var/www/vendor
      start: python3 health/app.py
      ports:
        - port: 5000
          httpSupport: true
