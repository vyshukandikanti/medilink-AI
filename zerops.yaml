zerops:
  - setup: api
    build:
      base: python@3.12
      buildCommands:
        - cd health
        - pip install -r requirements.txt
      deployFiles:
        - health
    run:
      base: python@3.12
      prepareCommands:
        - cd /var/www/health
        - pip install -r requirements.txt
      start: cd /var/www/health && python3 app.py
